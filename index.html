<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한라대학교 - 날씨 &amp; 명언</title>
  <!-- 한라대학교 파비콘 -->
  <link rel="icon" href="https://www.halla.ac.kr/favicon.ico" type="image/x-icon">
  <!-- Pretendard & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- 1. 상단 한라대학교 공식 로고 카드 (클릭 시 한라대 홈페이지 이동) -->
    <div class="logo-container">
      <a href="https://www.halla.ac.kr" target="_blank" rel="noopener noreferrer" class="univ-card" title="한라대학교 공식 홈페이지 바로가기">
        <div class="univ-emblem">
          <!-- 한라대학교 30주년/공식 방패 엠블럼 SVG -->
          <svg viewBox="0 0 60 70" width="46" height="54" aria-hidden="true">
            <defs>
              <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0e2338"/>
                <stop offset="50%" stop-color="#14324f"/>
                <stop offset="100%" stop-color="#0a1a2b"/>
              </linearGradient>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e5c07b"/>
                <stop offset="100%" stop-color="#c69b4e"/>
              </linearGradient>
              <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00b4d8"/>
                <stop offset="100%" stop-color="#0077b6"/>
              </linearGradient>
            </defs>
            <!-- 방패 베이스 -->
            <path d="M5 8 C5 8 30 2 30 2 C30 2 55 8 55 8 C55 42 30 65 30 68 C30 65 5 42 5 8 Z" fill="url(#shieldGrad)" stroke="#4a5d6e" stroke-width="1.2"/>
            <path d="M9 11 C9 11 30 6 30 6 C30 6 51 11 51 11 C51 39 30 60 30 62 C30 60 9 39 9 11 Z" fill="none" stroke="#2c4255" stroke-width="1"/>
            
            <!-- 30th & H 심볼 -->
            <text x="18" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="url(#cyanGrad)">3</text>
            <text x="32" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff">0</text>
            <circle cx="44" cy="22" r="2.5" fill="url(#goldGrad)"/>
            <line x1="16" y1="37" x2="44" y2="37" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
            <text x="30" y="46" font-family="'Noto Sans KR', sans-serif" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">HALLA</text>
          </svg>
        </div>
        <div class="univ-info">
          <span class="univ-ko">한라대학교</span>
          <span class="univ-en">HALLA UNIVERSITY</span>
        </div>
      </a>
    </div>

    <!-- 2. 오늘의 날씨 섹션 [원주, 서울, 제주] -->
    <section class="weather-section">
      <div class="weather-header">
        <h2 class="section-title">오늘의 날씨</h2>
        <button id="refresh-weather-btn" class="refresh-icon-btn" title="날씨 새로고침" aria-label="날씨 새로고침">
          <svg id="refresh-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="weather-grid">
        <!-- 1) 원주 카드 -->
        <div class="weather-card" id="weather-wonju">
          <div class="card-head">
            <span class="city-name">원주</span>
            <span class="city-pill">Wonju</span>
          </div>
          <div class="card-center">
            <div class="weather-icon-box" id="wonju-icon">
              <!-- SVG 동적 주입 -->
              <div class="loading-spinner"></div>
            </div>
            <div class="temp-box">
              <span class="temp-value" id="wonju-temp">0°C</span>
              <span class="weather-state" id="wonju-desc">맑음</span>
            </div>
          </div>
          <div class="card-foot">
            <span id="wonju-humidity">습도: 57%</span>
            <span id="wonju-wind">풍속: 6.9 m/s</span>
          </div>
        </div>

        <!-- 2) 서울 카드 -->
        <div class="weather-card" id="weather-seoul">
          <div class="card-head">
            <span class="city-name">서울</span>
            <span class="city-pill">Seoul</span>
          </div>
          <div class="card-center">
            <div class="weather-icon-box" id="seoul-icon">
              <div class="loading-spinner"></div>
            </div>
            <div class="temp-box">
              <span class="temp-value" id="seoul-temp">1°C</span>
              <span class="weather-state" id="seoul-desc">맑음</span>
            </div>
          </div>
          <div class="card-foot">
            <span id="seoul-humidity">습도: 48%</span>
            <span id="seoul-wind">풍속: 3.9 m/s</span>
          </div>
        </div>

        <!-- 3) 제주 카드 -->
        <div class="weather-card" id="weather-jeju">
          <div class="card-head">
            <span class="city-name">제주</span>
            <span class="city-pill">Jeju</span>
          </div>
          <div class="card-center">
            <div class="weather-icon-box" id="jeju-icon">
              <div class="loading-spinner"></div>
            </div>
            <div class="temp-box">
              <span class="temp-value" id="jeju-temp">10°C</span>
              <span class="weather-state" id="jeju-desc">구름 조금</span>
            </div>
          </div>
          <div class="card-foot">
            <span id="jeju-humidity">습도: 63%</span>
            <span id="jeju-wind">풍속: 12.2 m/s</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 오늘의 명언 섹션 -->
    <section class="quote-section">
      <div class="quote-card">
        <div class="quote-badge-wrap">
          <span class="quote-badge">오늘의 명언</span>
        </div>
        <p class="quote-text" id="quote-text">“우리가 두려워해야 할 유일한 것은 두려움 그 자체다.”</p>
        <p class="quote-author" id="quote-author">— 프랭클린 D. 루스벨트</p>
        
        <div class="quote-btn-wrap">
          <button id="next-quote-btn" class="other-quote-btn" title="다른 명언 보기">
            <svg id="quote-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/>
            </svg>
            <span>다른 명언</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 4. 구글 검색창 (깔끔하고 슬림한 미니멀 디자인) -->
    <section class="search-section">
      <form action="https://www.google.com/search" method="get" class="search-form" target="_blank">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="#94a3b8">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" name="q" class="search-input" placeholder="Google에서 검색..." autocomplete="off">
          <button type="submit" class="search-submit-btn">검색</button>
        </div>
      </form>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
